<!doctype html>
<!-- Source for favicon.ico, icon.png and apple-touch-icon.png: the wax seal from the hero envelope. Regenerate with: node share/render.js -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..900&display=swap" rel="stylesheet">
<style>
:root{--clay:#8A4129;--line:#EDEAE1;--grass:#4F6B45;--serif:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
--wght:500;--opsz:18;--fs:.64;--ring:.012}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent}
body{display:grid;place-items:center}
/* the hero's .seal at icon size */
.seal{position:relative;width:100vw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle at 36% 30%,#A95C40,var(--clay) 48%,#6A2E1C);
box-shadow:inset 0 .6vw .6vw rgba(255,214,190,.3),inset 0 -1.2vw 1.8vw rgba(45,12,2,.35);
color:var(--line);font:italic var(--wght) calc(100vw*var(--fs))/1 var(--serif);font-variation-settings:"opsz" var(--opsz)}
.seal::before{content:"";position:absolute;inset:10%;border-radius:50%;border:max(1px,calc(100vw*var(--ring))) solid rgba(237,234,225,.32)}
/* nudge the italic 5 to the optical center: its ink box a hair above true center, since the bowl carries the weight */
.seal span{transform:translate(.01em,-.02em)}
/* Bodoni's hairlines vanish at tab size: below 48px the 5 gets heavier, larger, and loses the ring */
.small{--wght:700;--opsz:6;--fs:.74}
.small .seal::before,.small .seal{box-shadow:none}
.small .seal::before{border:0}
/* apple-touch-icon: iOS fills transparency with black, so the seal sits on the hero's grass */
.tile{background:var(--grass)}
.tile .seal{width:70vw;box-shadow:inset 0 .6vw .6vw rgba(255,214,190,.3),inset 0 -1.2vw 1.8vw rgba(45,12,2,.35),0 2.4vw 4vw -1.6vw rgba(35,15,6,.5)}
.tile .seal{font-size:calc(70vw*var(--fs))}
</style>
</head>
<body>
<div class="seal"><span>5</span></div>
<script>
const q = new URLSearchParams(location.search), px = +q.get("px") || 192;
if (px < 48) document.body.classList.add("small");
if (q.has("tile")) document.body.classList.add("tile");
</script>
</body>
</html>
