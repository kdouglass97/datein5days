name: Deploy Apps Script

# Pushes apps-script/ to Google and moves the live web app (same /exec URL)
# to the new version. Runs on:
#   - a direct push to main that touches apps-script/
#   - after "Auto-ship Claude branches" finishes (its merges use GITHUB_TOKEN,
#     which can't trigger push workflows directly)
#   - manually from the Actions tab
# Skips if apps-script/ hasn't changed since the commit that's live, so
# versions don't pile up (Apps Script caps a project at 200).
#
# The /admin dashboard's password is the ADMIN_PASSWORD repo secret, written into
# apps-script/secret.js just before the push. It is never committed. After changing
# the secret, run this workflow by hand: a secret change alone doesn't touch apps-script/,
# so the automatic runs would skip it.
on:
  push:
    branches: [main]
    paths: ["apps-script/**"]
  workflow_run:
    workflows: ["Auto-ship Claude branches"]
    types: [completed]
  workflow_dispatch:

concurrency: apps-script-deploy

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps-script
    env:
      # The live web app deployment the landing page posts to
      DEPLOYMENT_ID: AKfycbwzPjNII26q7AdawsfeSSjkhjkXw7ZGKouEnx8mWh8N8LmGt5Y-sjEIBtCbV3STk7VU
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pinned, and no install scripts: the next step puts the Google login that can rewrite the
      # live script on this machine, so only a known clasp runs next to it. Bump on purpose.
      - run: npm install -g --ignore-scripts @google/clasp@3.4.1
      - name: Load clasp credentials
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC" > ~/.clasprc.json
      - name: Skip if nothing changed since the live version
        id: check
        run: |
          LIVE_SHA=$(clasp list-deployments | grep "$DEPLOYMENT_ID" | grep -oE 'gh [0-9a-f]{7}' | cut -d' ' -f2 || true)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -n "$LIVE_SHA" ] \
             && git cat-file -e "$LIVE_SHA" 2>/dev/null \
             && git diff --quiet "$LIVE_SHA" HEAD -- . ; then
            echo "apps-script/ unchanged since live commit $LIVE_SHA, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the dashboard password from its secret
        if: steps.check.outputs.skip != 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e 'require("fs").writeFileSync("secret.js", "// Written by the deploy from the ADMIN_PASSWORD secret. Never committed.\nconst ADMIN_PASSWORD_SECRET = " + JSON.stringify(process.env.ADMIN_PASSWORD || "") + ";\n")'
      - name: Push code to Apps Script
        if: steps.check.outputs.skip != 'true'
        run: clasp push --force
      - name: Update live web app
        if: steps.check.outputs.skip != 'true'
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          clasp update-deployment "$DEPLOYMENT_ID" --description "gh $SHA"
