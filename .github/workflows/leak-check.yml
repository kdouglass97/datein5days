name: Leak check

# Fetches datein5days.com the way a stranger would and fails if anything the repo keeps
# private is served, anything served looks like a secret key, or the security headers are
# off. The checks are in .github/scripts/leak-check.sh.
#
#   - after every merge auto-ship makes: waits until Vercel serves main, then checks everything.
#     (Its merges use GITHUB_TOKEN, which can't trigger push workflows, hence workflow_run.)
#   - a direct push to main that touches the allowlist, the headers or this check: the same
#   - every day, for what changes outside the repo (Vercel settings, a rollback, a failed deploy)
#   - on demand: Actions -> Leak check -> Run workflow
#   - those paths on any other branch: the private-file half only, since the branch isn't live
# Keys are also stopped before they ship: auto-ship.yml runs the keys check before merging.
# A failure shows red in the Actions tab.
on:
  workflow_run:
    workflows: ["Auto-ship Claude branches"]
    types: [completed]
  push:
    paths: [".vercelignore", "vercel.json", ".github/workflows/leak-check.yml", ".github/scripts/leak-check.sh"]
  schedule:
    - cron: "41 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full checks everything once the site serves this branch; private only asks for the private files"
        type: choice
        options: [auto, full, private]
        default: auto

permissions:
  contents: read

concurrency:
  group: leak-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the live site
        run: bash .github/scripts/leak-check.sh ${{ (inputs.mode == 'full' || inputs.mode == 'private') && inputs.mode || (github.ref == 'refs/heads/main' && 'full' || 'private') }}
